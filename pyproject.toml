[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geap-agent"
version = "0.1.0"
description = "GEAP Agent — ADK-powered multi-agent financial advisor"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the trio the planner repo documents as verified working with
    # Vertex (2.6.2 / 2.17.0 / 1.163.0). Do not float these: newer aiplatform
    # (1.164+) enables JSON_SCHEMA_FOR_FUNC_DECL, which sends `part_metadata`
    # that Gemini Enterprise Agent Platform rejects.
    "google-adk[gcp,db,a2a,agent-identity]==2.6.2",
    "google-cloud-aiplatform[agent_engines,adk]==1.163.0",
    "google-cloud-firestore",
    "google-genai==2.17.0",
    "python-dotenv",
    "a2a-sdk==1.1.2",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "mcp>=1.24,<2",
    "beautifulsoup4",
    "lxml",
    "yfinance",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "PLW", "C4", "SIM"]
ignore = [
    # Intentional broad excepts for graceful degradation (telemetry/auth fallback).
    "BLE001",
    # False positive: int(os.environ.get("PORT", 8080)) — int() converts the default.
    "PLW1508",
]

[tool.ruff.lint.per-file-ignores]
# Prompt files contain long instructional text; wrapping harms readability.
"app/prompts/*.py" = ["E501"]
"app/services/static_brokerage_service.py" = ["E501", "B905"]
